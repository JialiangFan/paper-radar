# Nginx configuration for zhatgpt.com
# / → 静态 dashboard（/var/www/paper-radar，由 scripts/update_site.sh 定时同步）
# /api/ /user/ /admin → 继续代理到 web UI (5001)，邮件里的旧链接不受影响
# 安装：sudo cp 本文件 /etc/nginx/sites-available/research_agent && sudo nginx -t && sudo systemctl reload nginx

server {

    server_name zhatgpt.com www.zhatgpt.com;

    # For Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Static dashboard
    root /var/www/paper-radar;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Web UI (keyword management, user portal, API) — keeps old email links working
    location ~ ^/(api|user|admin)(/|$) {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zhatgpt.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zhatgpt.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.zhatgpt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zhatgpt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name zhatgpt.com www.zhatgpt.com;
    return 404; # managed by Certbot

}
