# Example configuration for daily_news_email
# Copy to config.yaml and edit.

# NewsAPI configuration
# Get your API key from https://newsapi.org/
# Set NEWS_API_KEY environment variable or uncomment below:
# news_api_key: "your-api-key-here"

# News source configuration
country: "us"  # ISO 3166-1 alpha-2 country code (us, gb, etc.)
language: "en"  # ISO 639-1 language code
category: null  # Optional: business, entertainment, general, health, science, sports, technology
query: null  # Optional: search query (e.g., "technology", "AI", etc.)
use_everything: false  # If true, use get_everything instead of top_headlines
max_articles: 10  # Maximum number of articles to include

# Email title
email_title: "Daily News Digest"

# Email settings
# Recommended: Mailgun HTTP API (same env vars as paper_agent)
#   USE_MAILGUN_API=true
#   MAILGUN_API_KEY=key-...
#   MAILGUN_DOMAIN=mg.yourdomain.com
# If Mailgun fails or is disabled, the app falls back to SMTP config below.
email:
  # required for both Mailgun and SMTP (sender + recipients)
  from: "Your Name <noreply@yourdomain.com>"
  to:
    - "recipient@example.com"

  # SMTP fallback (optional if Mailgun works)
  smtp_host: "smtp.mailgun.org"
  smtp_port: 587
  smtp_user: "postmaster@mg.yourdomain.com"
  smtp_password: "your_smtp_password"
