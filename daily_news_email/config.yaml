# Daily News Email Configuration

# NewsAPI configuration
# Get your API key from https://newsapi.org/
# Set NEWS_API_KEY environment variable or uncomment below:
# news_api_key: "your-api-key-here"

# News source configuration
country: "us"  # ISO 3166-1 alpha-2 country code
language: "en"
category: null  # Optional: business, entertainment, general, health, science, sports, technology
query: null  # Optional: search query
use_everything: false
max_articles: 10

# Email title
email_title: "Daily News Digest"

# Email settings
email:
  from: "Your Name <noreply@zhatgpt.com>"
  to:
    - "REDACTED_EMAIL"

  # SMTP fallback
  smtp_host: "smtp.mailgun.org"
  smtp_port: 587
  smtp_user: "REDACTED_SMTP_USER"
  smtp_password: "REDACTED_SMTP_PASSWORD"
