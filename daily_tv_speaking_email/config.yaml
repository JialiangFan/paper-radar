# Example config.yaml (no secrets)

shows:
  - title: "Friends"
    season: 1
    episode: 1

language: "en"
snippet_duration_sec: 45

timezone: "America/Indiana/Indianapolis"

# Optional: make the email include enough read-aloud script for ~N minutes (estimated by characters)
target_read_minutes: 10

# Mailgun-first (paper_agent compatible):
# export USE_MAILGUN_API=true
# export MAILGUN_API_KEY=key-...
# export MAILGUN_DOMAIN=mg.yourdomain.com

email:
  from: "Your Name <noreply@zhatgpt.com>"
  to:
    - "REDACTED_EMAIL"

  # SMTP fallback (optional)
  smtp_host: "smtp.mailgun.org"
  smtp_port: 587
  smtp_user: "REDACTED_SMTP_USER"
  smtp_password: "REDACTED_SMTP_PASSWORD"
