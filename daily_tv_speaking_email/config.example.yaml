# Example configuration for daily_tv_speaking_email
# Copy to config.yaml and edit.

shows:
  - title: "Friends"
    season: 1
    episode: 1
  - title: "The Office"
    season: 2
    episode: 1

language: "en"
# Allowed range: 30–60 seconds
snippet_duration_sec: 45

# Optional: make the email include enough read-aloud script for ~N minutes (estimated by characters)
target_read_minutes: 10

timezone: "America/Indiana/Indianapolis"

# Email settings
# Recommended in this repo: Mailgun HTTP API (same env vars as paper_agent)
#   USE_MAILGUN_API=true
#   MAILGUN_API_KEY=key-...
#   MAILGUN_DOMAIN=mg.yourdomain.com
# If Mailgun fails or is disabled, the app falls back to SMTP config below.
email:
  # required for both Mailgun and SMTP (sender + recipients)
  from: "Your Name <noreply@yourdomain.com>"
  to:
    - "recipient@example.com"

  # SMTP fallback (optional if Mailgun works)
  smtp_host: "smtp.mailgun.org"
  smtp_port: 587
  smtp_user: "postmaster@mg.yourdomain.com"
  smtp_password: "your_smtp_password"

# Optional:
# state_path: "./state.json"
# show_selection: "round_robin"  # or "random"
