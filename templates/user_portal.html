<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户设置 - Research Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Toast animation */
        .toast-enter { animation: slideIn 0.3s ease-out; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-purple-700 p-4 sm:p-8">

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

    <div class="max-w-2xl mx-auto space-y-6">

        <!-- Header -->
        <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">用户设置 <span class="text-sm font-normal text-gray-400">User Settings</span></h1>
                        <p class="text-gray-500 text-sm">管理你的订阅偏好和关键词</p>
                    </div>
                </div>
                <a href="/" class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 rounded-lg hover:bg-indigo-100 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/>
                    </svg>
                    首页 Home
                </a>
            </div>
        </div>

        <!-- Loading spinner -->
        <div id="loading" class="bg-white rounded-xl shadow-lg p-12 flex justify-center">
            <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
        </div>

        <!-- Main content (hidden until loaded) -->
        <div id="main-content" class="hidden space-y-6">

            <!-- Profile Section -->
            <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-1 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    个人信息 <span class="text-sm font-normal text-gray-400">Profile</span>
                </h2>
                <p class="text-gray-400 text-xs mb-5">修改后点击保存按钮生效</p>

                <div class="space-y-4">
                    <!-- Email (read-only) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">邮箱 <span class="text-gray-400">Email</span></label>
                        <input id="profile-email" type="email" disabled
                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed">
                    </div>

                    <!-- Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">姓名 <span class="text-gray-400">Name</span></label>
                        <input id="profile-name" type="text" placeholder="输入你的姓名"
                            class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    </div>

                    <!-- Language -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">语言 <span class="text-gray-400">Language</span></label>
                        <select id="profile-lang"
                            class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                            <option value="zh">中文 (Chinese)</option>
                            <option value="en">English</option>
                        </select>
                    </div>

                    <!-- Email Frequency -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">邮件频率 <span class="text-gray-400">Email Frequency</span></label>
                        <select id="profile-frequency"
                            class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                            <option value="daily">每天 (Daily)</option>
                            <option value="every_3_days">每3天 (Every 3 Days)</option>
                            <option value="weekly">每周 (Weekly)</option>
                        </select>
                    </div>

                    <!-- Save button -->
                    <div class="pt-2">
                        <button onclick="saveProfile()" id="btn-save-profile"
                            class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 active:bg-indigo-800 transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            保存设置 <span class="text-indigo-200 text-sm">Save</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Keywords Section -->
            <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-1 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/>
                    </svg>
                    关注关键词 <span class="text-sm font-normal text-gray-400">Keywords</span>
                </h2>
                <p class="text-gray-400 text-xs mb-5">系统将根据关键词为你筛选相关论文</p>

                <!-- Keywords tags -->
                <div id="keywords-container" class="flex flex-wrap gap-2 mb-5 min-h-[2.5rem]">
                    <span class="text-gray-400 text-sm" id="no-keywords-msg">暂无关键词 No keywords yet</span>
                </div>

                <!-- Add keyword input -->
                <div class="flex gap-2">
                    <input id="new-keyword" type="text" placeholder="输入新关键词..."
                        class="flex-1 px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        onkeydown="if(event.key==='Enter') addKeyword()">
                    <button onclick="addKeyword()"
                        class="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 active:bg-indigo-800 transition flex items-center gap-1.5 whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        添加
                    </button>
                </div>
            </div>

            <!-- Paper History Section -->
            <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-1 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    论文历史 <span class="text-sm font-normal text-gray-400">Paper History</span>
                </h2>
                <p class="text-gray-400 text-xs mb-5">根据你的关键词匹配的历史论文</p>

                <div id="papers-container" class="space-y-4">
                    <div id="papers-loading" class="flex justify-center py-8">
                        <svg class="animate-spin h-6 w-6 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                    </div>
                </div>

                <div id="papers-empty" class="hidden text-center py-8 text-gray-400 text-sm">
                    暂无匹配论文 No matching papers yet
                </div>

                <div id="load-more-container" class="hidden mt-4 text-center">
                    <button onclick="loadMorePapers()" id="btn-load-more"
                        class="px-6 py-2.5 bg-indigo-50 text-indigo-600 font-medium rounded-lg hover:bg-indigo-100 transition flex items-center gap-2 mx-auto disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                        加载更多 <span class="text-indigo-400 text-sm">Load More</span>
                    </button>
                    <p id="papers-count" class="text-xs text-gray-400 mt-2"></p>
                </div>
            </div>

            <!-- Unsubscribe Section -->
            <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
                <h2 class="text-lg font-semibold text-gray-800 mb-1 flex items-center gap-2">
                    <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                    </svg>
                    取消订阅 <span class="text-sm font-normal text-gray-400">Unsubscribe</span>
                </h2>
                <p class="text-gray-500 text-sm mb-4">取消订阅后将不再收到邮件推送。此操作不可撤销。</p>
                <button onclick="confirmUnsubscribe()" id="btn-unsubscribe"
                    class="px-6 py-2.5 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 active:bg-red-800 transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    取消订阅 <span class="text-red-200 text-sm">Unsubscribe</span>
                </button>
            </div>

        </div>

        <!-- Footer -->
        <p class="text-center text-white/60 text-xs pb-4">Research Agent &copy; 2026</p>

    </div>

    <!-- Unsubscribe confirmation modal -->
    <div id="modal-unsubscribe" class="fixed inset-0 bg-black/50 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full space-y-4">
            <h3 class="text-lg font-semibold text-gray-800">确认取消订阅？</h3>
            <p class="text-gray-500 text-sm">取消订阅后你将不再收到论文推送邮件，此操作无法恢复。</p>
            <div class="flex gap-3 justify-end">
                <button onclick="closeModal()"
                    class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition font-medium">
                    取消 Cancel
                </button>
                <button onclick="doUnsubscribe()"
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-medium">
                    确认取消订阅
                </button>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = "{{ token }}";
        const API_BASE = `/api/user/${TOKEN}`;

        // ========================
        // Toast notifications
        // ========================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-indigo-500'
            };
            toast.className = `${colors[type] || colors.info} text-white px-5 py-3 rounded-lg shadow-lg text-sm font-medium toast-enter flex items-center gap-2`;

            const icons = {
                success: '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>',
                error: '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>',
                info: '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
            };
            toast.innerHTML = (icons[type] || icons.info) + `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
        }

        // ========================
        // Profile
        // ========================
        async function loadProfile() {
            try {
                const res = await fetch(`${API_BASE}/profile`);
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                const user = data.user || data;

                document.getElementById('profile-email').value = user.email || '';
                document.getElementById('profile-name').value = user.name || '';
                document.getElementById('profile-lang').value = user.lang || 'zh';
                document.getElementById('profile-frequency').value = user.email_frequency || 'daily';

                // Load keywords from profile if present
                if (user.keywords && Array.isArray(user.keywords)) {
                    renderKeywords(user.keywords);
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            } catch (err) {
                showToast('无法加载用户信息 Failed to load profile', 'error');
                document.getElementById('loading').innerHTML = '<p class="text-red-500 text-center">加载失败，请刷新重试。</p>';
            }
        }

        async function saveProfile() {
            const btn = document.getElementById('btn-save-profile');
            btn.disabled = true;
            try {
                const body = {
                    name: document.getElementById('profile-name').value.trim(),
                    lang: document.getElementById('profile-lang').value,
                    email_frequency: document.getElementById('profile-frequency').value
                };
                const res = await fetch(`${API_BASE}/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error('保存失败');
                showToast('设置已保存 Settings saved', 'success');
            } catch (err) {
                showToast('保存失败，请重试 Save failed', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // ========================
        // Keywords
        // ========================
        let currentKeywords = [];

        function renderKeywords(keywords) {
            currentKeywords = keywords;
            const container = document.getElementById('keywords-container');
            const noMsg = document.getElementById('no-keywords-msg');

            // Clear existing tags (keep the no-keywords message element)
            container.querySelectorAll('.keyword-tag').forEach(el => el.remove());

            if (keywords.length === 0) {
                if (!noMsg) {
                    const span = document.createElement('span');
                    span.id = 'no-keywords-msg';
                    span.className = 'text-gray-400 text-sm';
                    span.textContent = '暂无关键词 No keywords yet';
                    container.appendChild(span);
                } else {
                    noMsg.classList.remove('hidden');
                }
                return;
            }

            if (noMsg) noMsg.classList.add('hidden');

            keywords.forEach(kw => {
                const tag = document.createElement('span');
                tag.className = 'keyword-tag inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-full text-sm font-medium border border-indigo-100 hover:bg-indigo-100 transition';
                tag.innerHTML = `
                    <span>${escapeHtml(kw)}</span>
                    <button onclick="deleteKeyword('${escapeHtml(kw).replace(/'/g, "\\'")}')"
                        class="w-4 h-4 rounded-full hover:bg-indigo-200 flex items-center justify-center transition text-indigo-400 hover:text-indigo-700">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                `;
                container.appendChild(tag);
            });
        }

        async function addKeyword() {
            const input = document.getElementById('new-keyword');
            const keyword = input.value.trim();
            if (!keyword) {
                showToast('请输入关键词 Please enter a keyword', 'info');
                return;
            }
            if (currentKeywords.includes(keyword)) {
                showToast('关键词已存在 Keyword already exists', 'info');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/keywords`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });
                if (!res.ok) throw new Error('添加失败');
                currentKeywords.push(keyword);
                renderKeywords(currentKeywords);
                input.value = '';
                showToast(`已添加关键词: ${keyword}`, 'success');
            } catch (err) {
                showToast('添加失败，请重试 Add failed', 'error');
            }
        }

        async function deleteKeyword(keyword) {
            try {
                const res = await fetch(`${API_BASE}/keywords/${encodeURIComponent(keyword)}`, {
                    method: 'DELETE'
                });
                if (!res.ok) throw new Error('删除失败');
                currentKeywords = currentKeywords.filter(k => k !== keyword);
                renderKeywords(currentKeywords);
                showToast(`已删除关键词: ${keyword}`, 'success');
            } catch (err) {
                showToast('删除失败，请重试 Delete failed', 'error');
            }
        }

        // ========================
        // Unsubscribe
        // ========================
        function confirmUnsubscribe() {
            document.getElementById('modal-unsubscribe').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-unsubscribe').classList.add('hidden');
        }

        async function doUnsubscribe() {
            closeModal();
            const btn = document.getElementById('btn-unsubscribe');
            btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/unsubscribe`, {
                    method: 'POST'
                });
                if (!res.ok) throw new Error('取消订阅失败');
                showToast('已取消订阅 Unsubscribed successfully', 'success');
                setTimeout(() => {
                    document.getElementById('main-content').innerHTML = `
                        <div class="bg-white rounded-xl shadow-lg p-8 text-center">
                            <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <h2 class="text-xl font-semibold text-gray-700 mb-2">已取消订阅</h2>
                            <p class="text-gray-400">你已成功取消订阅，将不再收到邮件推送。</p>
                            <p class="text-gray-400 text-sm mt-1">You have been unsubscribed successfully.</p>
                        </div>
                    `;
                }, 1000);
            } catch (err) {
                showToast('取消订阅失败，请重试 Unsubscribe failed', 'error');
                btn.disabled = false;
            }
        }

        // ========================
        // Utility
        // ========================
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // ========================
        // Paper History
        // ========================
        let papersOffset = 0;
        const papersLimit = 20;
        let papersTotal = 0;

        async function loadPapers(append = false) {
            try {
                const res = await fetch(`${API_BASE}/papers?limit=${papersLimit}&offset=${papersOffset}`);
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                papersTotal = data.total || 0;
                const papers = data.papers || [];

                document.getElementById('papers-loading').classList.add('hidden');

                if (papers.length === 0 && !append) {
                    document.getElementById('papers-empty').classList.remove('hidden');
                    document.getElementById('load-more-container').classList.add('hidden');
                    return;
                }

                document.getElementById('papers-empty').classList.add('hidden');
                renderPaperCards(papers, append);

                const loaded = papersOffset + papers.length;
                if (loaded < papersTotal) {
                    document.getElementById('load-more-container').classList.remove('hidden');
                    document.getElementById('papers-count').textContent = `${loaded} / ${papersTotal}`;
                } else {
                    document.getElementById('load-more-container').classList.add('hidden');
                }
            } catch (err) {
                document.getElementById('papers-loading').classList.add('hidden');
                if (!append) {
                    document.getElementById('papers-empty').classList.remove('hidden');
                }
                showToast('加载论文失败 Failed to load papers', 'error');
            }
        }

        function renderPaperCards(papers, append) {
            const container = document.getElementById('papers-container');
            if (!append) {
                // Clear all except loading spinner
                container.querySelectorAll('.paper-card').forEach(el => el.remove());
            }

            papers.forEach(paper => {
                const card = document.createElement('div');
                card.className = 'paper-card border border-gray-200 rounded-xl p-5 hover:shadow-md transition-shadow bg-gray-50/50';

                const kwTag = paper.keyword
                    ? `<span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-medium px-2.5 py-0.5 rounded-full">${escapeHtml(paper.keyword)}</span>`
                    : '';

                const summaryBlock = paper.summary
                    ? `<details class="group mt-2">
                        <summary class="cursor-pointer text-sm font-medium text-indigo-500 hover:text-indigo-700 transition-colors select-none">AI 总结 / Summary</summary>
                        <p class="mt-2 text-sm text-gray-600 leading-relaxed pl-2 border-l-2 border-indigo-200">${escapeHtml(paper.summary)}</p>
                       </details>`
                    : '';

                card.innerHTML = `
                    <a href="${escapeHtml(paper.url || '')}" target="_blank" class="text-base font-semibold text-indigo-600 hover:text-indigo-800 transition-colors leading-snug block mb-2">${escapeHtml(paper.title || '')}</a>
                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-500 mb-2">
                        <span><strong>作者 Authors</strong>: ${escapeHtml(paper.authors || '')}</span>
                        <span><strong>日期 Date</strong>: ${escapeHtml(paper.date || '')}</span>
                        ${kwTag}
                    </div>
                    ${summaryBlock}
                `;

                container.appendChild(card);
            });
        }

        function loadMorePapers() {
            papersOffset += papersLimit;
            const btn = document.getElementById('btn-load-more');
            btn.disabled = true;
            loadPapers(true).finally(() => { btn.disabled = false; });
        }

        // ========================
        // Init
        // ========================
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            loadPapers();
        });
    </script>
</body>
</html>
